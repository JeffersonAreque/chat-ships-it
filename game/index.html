<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>Chat Ships It — Twitch Builds a Game</title>
    <link rel="stylesheet" href="/assets/brand.css">
    <link rel="stylesheet" href="/game/game.css">
    <script>if (new URLSearchParams(location.search).get('obs') === '1') document.documentElement.classList.add('obs-mode');</script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <a class="wordmark" href="/game" aria-label="Chat Ships It home"><span class="wordmark-icon">CS</span> CHAT SHIPS IT</a>
        <div class="game-heading"><p class="eyebrow">TWITCH × CODEX LIVE</p><h1>Chat builds a game from zero</h1></div>
        <div class="score-chip" aria-live="polite"><span>SCORE</span><strong id="score">0</strong></div>
      </header>
      <div id="build-banner" class="build-status" role="status" aria-live="polite" hidden>
        <span id="build-clock">LIVE BUILD 0:00</span>
        <ol class="stage-dots" aria-label="Build stages">
          <li id="stage-queued" class="stage-dot" aria-label="Queued"></li>
          <li id="stage-building" class="stage-dot" aria-label="Building"></li>
          <li id="stage-validating" class="stage-dot" aria-label="Validating"></li>
          <li id="stage-shipped" class="stage-dot" aria-label="Shipped"></li>
        </ol>
      </div>
      <div id="idle-status" class="idle-status" role="status" aria-live="polite">Waiting for chat ideas</div>
      <canvas id="game" width="1280" height="720" aria-label="A game built live by Twitch chat"></canvas>
      <p class="game-help">Ideas in chat → votes → streamer approval → shipped to the game</p>
      <p class="game-chat-cta">Type <code>!idea &lt;your idea&gt;</code> in chat</p>
      <section id="viewer-credits" class="credit-ticker" aria-label="Viewer credits" hidden>
        <span class="ticker-label">Built by chat:</span>
        <div class="ticker-window"><div id="credits-track" class="ticker-track"><ul id="credit-list"></ul></div></div>
      </section>
    </main>
    <script src="/game/game.js" defer></script>
    <script src="/game/buildNotice.js" defer></script>
    <script src="/game/buildStatus.js" defer></script>
    <script src="/game/credits.js" defer></script>
    <script src="/game/reloader.js" defer></script>
  </body>
</html>
